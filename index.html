<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Апскейлер</title>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.webgpu.min.js"></script>
<style>
:root{--bg:#eef0f6;--panel:#fff;--ink:#1a1d29;--mute:#6b7186;--acc:#4766e5;--line:#d9dce8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--panel:#1c202c;--ink:#e8eaf2;--mute:#8b92aa;--acc:#8aa4ff;--line:#2b3040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 12px 24px}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
h1{font-size:18px;margin:14px 0 0}
label{display:block;color:var(--mute);font-size:13px;margin-top:8px}
input,select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{padding:0;accent-color:var(--acc)}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;margin-top:10px;width:100%}
@media (prefers-color-scheme:dark){button{color:#12141c}}
button:disabled{opacity:.5}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
canvas{display:block;margin:0 auto;max-width:100%;max-height:55vh;background:#000;border-radius:10px}
#st{color:var(--mute);margin-top:8px;min-height:20px}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Апскейлер (Real-ESRGAN)</h1>
  <div class="card">
    <input type="file" id="file" accept="video/*,image/*">
    <div class="row">
      <div><label>Вход: длинная сторона</label>
      <select id="inp"><option>360</option><option selected>480</option><option>720</option><option>1024</option></select></div>
      <div><label>Увеличить</label>
      <select id="sc"><option value="4" selected>×4</option><option value="2">×2</option></select></div>
    </div>
    <div class="row">
      <div><label>Видео: секунд</label><input type="number" id="secs" value="3" min="1" max="30"></div>
      <div><label>Видео: кадров/с</label><input type="number" id="fps" value="15" min="5" max="30"></div>
    </div>
    <button id="go">Улучшить</button>
    <div id="st"></div>
  </div>
  <div class="card">
    <canvas id="out" width="320" height="180"></canvas>
    <label>Кадр</label><input type="range" id="seek" min="0" max="0" value="0">
    <div class="row"><button class="g" id="cmp" disabled>Показать «до»</button><button id="play" disabled>Пуск</button></div>
    <button id="exp" disabled>Сохранить</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), out=$('out'), oc=out.getContext('2d');
const say=s=>$('st').textContent=s;
let sess=null, ep='', buf=null, frames=[], OW=0, OH=0, FPS=15, playing=false, isImg=false, showOrig=false;
const blob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));

async function mk(e){sess=await ort.InferenceSession.create(buf,{executionProviders:[e]});ep=e}
async function loadModel(){
  if(sess) return;
  say('Загружаю модель…');
  const r=await fetch('realesr-general-x4v3.onnx');
  if(!r.ok) throw new Error('Файл realesr-general-x4v3.onnx не найден рядом с index.html');
  buf=await r.arrayBuffer();
  ort.env.wasm.numThreads=1;
  try{await mk('webgpu')}catch(e){await mk('wasm')}
}
async function infer(a,h,w){
  const feeds={[sess.inputNames[0]]:new ort.Tensor('float32',a,[1,3,h,w])};
  try{const r=await sess.run(feeds);return r[sess.outputNames[0]].data}
  catch(e){if(ep==='webgpu'){await mk('wasm');return infer(a,h,w)}throw e}
}

async function up4(src,iw,ih,onTile){
  const o=document.createElement('canvas'); o.width=iw*4; o.height=ih*4;
  const ox=o.getContext('2d'), sc=src.getContext('2d',{willReadFrequently:true});
  const T=128,P=8; let k=0;
  for(let y=0;y<ih;y+=T)for(let x=0;x<iw;x+=T){
    const w=Math.min(T,iw-x), h=Math.min(T,ih-y);
    const x0=Math.max(0,x-P), y0=Math.max(0,y-P), x1=Math.min(iw,x+w+P), y1=Math.min(ih,y+h+P);
    const tw=x1-x0, th=y1-y0, n=tw*th;
    const d=sc.getImageData(x0,y0,tw,th).data, a=new Float32Array(3*n);
    for(let p=0;p<n;p++){a[p]=d[p*4]/255;a[n+p]=d[p*4+1]/255;a[2*n+p]=d[p*4+2]/255}
    const r=await infer(a,th,tw);
    const ow=tw*4, oh=th*4, cw=w*4, ch=h*4, offx=(x-x0)*4, offy=(y-y0)*4;
    const im=ox.createImageData(cw,ch), q=im.data;
    for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){
      const s=(offy+j)*ow+offx+i, t=(j*cw+i)*4;
      q[t]=Math.min(255,Math.max(0,r[s]*255));
      q[t+1]=Math.min(255,Math.max(0,r[ow*oh+s]*255));
      q[t+2]=Math.min(255,Math.max(0,r[2*ow*oh+s]*255));
      q[t+3]=255;
    }
    ox.putImageData(im,x*4,y*4);
    onTile&&onTile(++k);
  }
  return o;
}

async function run(){
  const f=$('file').files[0]; if(!f) return say('Сначала выберите видео или фото');
  $('go').disabled=true; ['play','exp','cmp'].forEach(i=>$(i).disabled=true); playing=false; showOrig=false;
  try{
    await loadModel();
    isImg=f.type.startsWith('image');
    const url=URL.createObjectURL(f); let el, sw, sh;
    if(isImg){el=new Image();el.src=url;await el.decode();sw=el.naturalWidth;sh=el.naturalHeight}
    else{
      el=document.createElement('video');el.src=url;el.muted=true;el.playsInline=true;
      await new Promise((ok,no)=>{el.onloadedmetadata=ok;el.onerror=()=>no(new Error('Не удалось открыть видео'))});
      sw=el.videoWidth;sh=el.videoHeight;
    }
    const s=Math.min(1,+$('inp').value/Math.max(sw,sh));
    const iw=Math.max(8,Math.round(sw*s/2)*2), ih=Math.max(8,Math.round(sh*s/2)*2);
    const k=+$('sc').value; OW=iw*k; OH=ih*k;
    FPS=+$('fps').value;
    const n=isImg?1:Math.max(1,Math.floor(Math.min(el.duration,+$('secs').value)*FPS));
    const c=document.createElement('canvas'); c.width=iw; c.height=ih;
    const x=c.getContext('2d',{willReadFrequently:true});
    const fin=document.createElement('canvas'); fin.width=OW; fin.height=OH;
    const fx=fin.getContext('2d'); fx.imageSmoothingQuality='high';
    const tiles=Math.ceil(iw/128)*Math.ceil(ih/128);
    frames=[]; const t0=performance.now();
    for(let i=0;i<n;i++){
      if(!isImg){
        const sk=new Promise(r=>el.addEventListener('seeked',r,{once:true}));
        el.currentTime=(i+0.5)/FPS; await sk;
      }
      x.drawImage(el,0,0,iw,ih);
      const orig=await blob(c,'image/jpeg',.92);
      const big=await up4(c,iw,ih,t=>{
        const done=i*tiles+t, el_=(performance.now()-t0)/1000, eta=el_/done*(n*tiles-done);
        say(`Кадр ${i+1} из ${n}, блок ${t}/${tiles} (${ep}), осталось ~${Math.round(eta)} с`);
      });
      fx.drawImage(big,0,0,OW,OH);
      frames.push({o:orig,u:await blob(fin,isImg?'image/png':'image/jpeg',.93)});
    }
    out.width=OW; out.height=OH; $('seek').max=frames.length-1; $('seek').value=0;
    await draw(0);
    say(`Готово: ${iw}×${ih} → ${OW}×${OH}`);
    ['exp','cmp'].forEach(i=>$(i).disabled=false); $('play').disabled=isImg;
  }catch(e){say('Ошибка: '+e.message);console.error(e)}
  $('go').disabled=false;
}

async function draw(i){
  const b=await createImageBitmap(frames[i][showOrig?'o':'u']);
  oc.imageSmoothingEnabled=true; oc.clearRect(0,0,OW,OH); oc.drawImage(b,0,0,OW,OH); b.close();
}
$('go').onclick=run;
$('seek').oninput=()=>frames.length&&draw(+$('seek').value);
$('cmp').onclick=()=>{showOrig=!showOrig;$('cmp').textContent=showOrig?'Показать «после»':'Показать «до»';draw(+$('seek').value)};
$('play').onclick=async()=>{
  if(playing){playing=false;$('play').textContent='Пуск';return}
  playing=true;$('play').textContent='Пауза';
  let i=+$('seek').value; if(i>=frames.length-1) i=0;
  for(;i<frames.length&&playing;i++){
    const t=performance.now(); $('seek').value=i; await draw(i);
    await new Promise(r=>setTimeout(r,Math.max(0,1000/FPS-(performance.now()-t))));
  }
  playing=false;$('play').textContent='Пуск';
};
$('exp').onclick=async()=>{
  playing=false; showOrig=false; $('cmp').textContent='Показать «до»';
  const dl=(b,name)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()};
  if(isImg){dl(frames[0].u,'upscaled.png');return say('Фото сохранено')}
  $('exp').disabled=true;$('play').disabled=true;
  const types=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(out.captureStream(FPS),{mimeType:mime,videoBitsPerSecond:16e6});
  const parts=[]; rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  const done=new Promise(r=>rec.onstop=r); rec.start();
  for(let i=0;i<frames.length;i++){
    const t=performance.now(); say(`Запись ${i+1} из ${frames.length}`); await draw(i);
    await new Promise(r=>setTimeout(r,Math.max(0,1000/FPS-(performance.now()-t))));
  }
  rec.stop(); await done;
  dl(new Blob(parts,{type:mime||'video/webm'}),'upscaled.'+(mime.includes('mp4')?'mp4':'webm'));
  say('Видео сохранено (без звука).');$('exp').disabled=false;$('play').disabled=false;
};
</script>
</body>
</html>
